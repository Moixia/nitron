<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== SISTEMA DE DISEÑO (todo sale de estos valores) =====
   Espaciado: escala de 4 px (--s1..--s6).
   --pad (12 px) = inset estándar: padding lateral de filas/celdas Y espacio icono→texto.
   Iconos 16 px. Controles: radio 8 px. Cajas: radio 10 px. Líneas 1 px --line.
   Tipografía: título 30 · sección 17 · texto 15 · tabla/botón 14 · apoyo 13. */
:root{
  color-scheme:light;
  --side-width:264px;
  --bg:light-dark(#ffffff,#1f2123); --side:light-dark(#fafafa,#252729); --ink:light-dark(#2f3437,#e6e6e3);
  --muted:light-dark(#616568,#9a9d9f); --line:light-dark(#e5e5e5,#383b3e); --hover:light-dark(#f2f2f2,#2d3033);
  --accent:light-dark(#1f5f8b,#7fb4dc); --on-accent:light-dark(#ffffff,#10202c);
  --mention-bg:light-dark(#eaf2f9,#22313d); --mention-bg-hover:light-dark(#dcebf7,#2a3d4c);
  --ok:light-dark(#2e7d5b,#6fc29b); --ok-bg:light-dark(#e5f2ec,#23342c);
  --warn:light-dark(#a85b12,#e0a060); --warn-bg:light-dark(#fbefdf,#3a2f22);
  --danger:light-dark(#b3372f,#e58880); --danger-bg:light-dark(#fbe9e7,#3d2826);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --pad:12px; --icon:16px;
  --r:8px; --r-box:12px;
  --line-soft:color-mix(in srgb,var(--line) 50%,transparent); --line-strong:light-dark(#8d9194,#6b6f73);
  --t-fast:120ms; --t-base:200ms; --t-slow:320ms; --ease:cubic-bezier(.22,1,.36,1);
  --sh-menu:0 4px 16px rgba(0,0,0,.08); --sh-pop:0 8px 28px rgba(0,0,0,.14); --sh-modal:0 20px 70px rgba(0,0,0,.26);
  --fs-title:30px; --fs-h2:17px; --fs-body:15px; --fs-small:14px; --fs-cap:13px;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;scrollbar-width:auto;-ms-overflow-style:auto}
body::-webkit-scrollbar{width:0;height:0}
main{scrollbar-width:auto;-ms-overflow-style:auto}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
*::-webkit-scrollbar-track{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}}
body.document-open main,body.document-open #page,body.document-open .doc{scrollbar-width:none;-ms-overflow-style:none}
body.document-open main::-webkit-scrollbar,body.document-open #page::-webkit-scrollbar,body.document-open .doc::-webkit-scrollbar{display:none}
body{background:var(--bg);color:var(--ink);font:var(--fs-body)/1.5 var(--font);display:flex;overflow:hidden}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.box:focus-within,.cfval:focus{outline-offset:0}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:1000;background:var(--bg);color:var(--ink);padding:8px 12px;border:1px solid var(--accent);border-radius:6px;text-decoration:none}
.skip:focus{left:8px;top:8px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

svg{width:var(--icon);height:var(--icon);flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.muted{color:var(--muted);font-size:var(--fs-cap)}

/* Barra lateral */
.side{width:var(--side-width);flex:none;min-width:56px;background:var(--side);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;position:relative;padding:var(--s5) var(--s2) var(--s6);transition:width .16s ease,padding .16s ease}
.side::after{content:"";position:absolute;top:0;right:0;width:6px;height:100%;cursor:ew-resize}.side::-webkit-scrollbar{display:none}.brand{display:flex;align-items:center;gap:10px;padding:var(--s2) var(--pad) var(--s3);font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand .mark,.brand .bname{cursor:pointer}
.brand .mark{display:grid;place-items:center;width:24px;height:24px;flex:none}
.brand .mark svg{width:23px;height:23px;opacity:.8;stroke-width:1.7}
.brand .bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.brand-inbox{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--muted);margin-left:auto;transition:background .15s,color .15s}
.brand-inbox:hover,.brand-inbox:focus-visible{background:var(--hover);color:var(--ink)}.brand-inbox svg{width:17px;height:17px;opacity:.78}
body.rail .brand-inbox{display:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;padding:0;border:0;background:none;border-radius:6px;color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.group{display:flex;align-items:center;justify-content:space-between;margin:24px 0 var(--s2);padding:0 var(--pad);font-size:var(--fs-cap);color:var(--muted);font-weight:500}
.nav a,.nav button{display:flex;align-items:center;gap:var(--pad);width:100%;text-align:left;border:0;background:none;padding:8px var(--pad);border-radius:6px;color:var(--ink)}
.nav a:hover,.nav button:hover{background:var(--hover)}
.nav a.on{background:var(--hover);font-weight:500}
.nav .mut{color:var(--muted)}
.nav .group .plus{width:auto;padding:2px 6px;margin-right:-6px}
.nav .lbl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .filehome{display:none}
.nav .pmark{display:grid;place-items:center;width:var(--icon);height:var(--icon);flex:none}.nav .pmark svg{width:15px;height:15px;opacity:.23;stroke-width:1.7}
.nav .pmark svg{width:14px;height:14px;opacity:.22;stroke-width:1.7}
.nav .pmark svg circle{r:3.6px;stroke-width:1.1}

/* Barra lateral compacta (escritorio) */
@media (min-width:821px){
  body.rail .side{width:56px;padding-left:6px;padding-right:6px}
  body.rail .brand{justify-content:center;padding:var(--s2) 0 var(--s3);position:relative}
  body.rail .brand .bname,body.rail .group>span,body.rail .group .dd,body.rail .nav .lbl,body.rail .nav .mut{display:none}
  body.rail .nav .filehome{display:flex}
  body.rail .group{height:1px;margin:var(--s4) 4px;padding:0;background:var(--line);overflow:hidden}
  body.rail .nav a{justify-content:center;padding:7px 0;gap:0}
  body.rail .nav .pmark,body.rail .nav .pmark svg{width:18px;height:18px}
}

/* Contenido */
main{flex:1;min-width:0;height:100vh;overflow:auto;overscroll-behavior:contain}
/* Vista inicial: bienvenida limpia, sin navegación lateral ni barra de atrás.
   Al salir, ambos elementos vuelven con una transición suave. */
.side{transition:width .32s cubic-bezier(.22,1,.36,1),padding .32s cubic-bezier(.22,1,.36,1),opacity .22s ease,transform .32s cubic-bezier(.22,1,.36,1)}
.top{transition:opacity .22s ease,transform .32s cubic-bezier(.22,1,.36,1),max-height .32s cubic-bezier(.22,1,.36,1),padding .32s cubic-bezier(.22,1,.36,1)}
body.welcome-mode .side{width:0;padding-left:0;padding-right:0;border-right:0;opacity:0;transform:translateX(-18px);pointer-events:none;overflow:hidden}
body.welcome-mode .top{max-height:0;opacity:0;transform:translateY(-8px);padding-top:0;padding-bottom:0;overflow:hidden;pointer-events:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s6);color:var(--muted);font-size:var(--fs-small);border-bottom:1px solid var(--line)}
.top #crumbs{position:absolute;left:50%;transform:translateX(-50%);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:var(--ink);font-size:var(--fs-h2);font-weight:600}
.top #crumbs a{color:var(--muted);font-weight:500}
.top .sep{opacity:.5}
.btn.menu{display:none;min-width:36px}.btn.menu:focus-visible{outline-offset:1px}
.page{width:calc(100% - 64px);max-width:1600px;margin:0 auto;padding:var(--s6) 0 96px}
h1{font-size:var(--fs-title);line-height:1.2;margin:0 0 var(--s4);font-weight:600;letter-spacing:-.01em}
h2{font-size:var(--fs-h2);margin:var(--s6) 0 var(--s3);font-weight:600}
.lead{color:var(--muted);margin:0 0 var(--s4)}
.empty{color:var(--muted);padding:var(--s6) 0;text-align:center}
.filehint{margin:0 0 var(--s3)}
.save-state{white-space:nowrap}

body.resizing .side{transition:none}

/* Barra de acciones agrupada: un solo contenedor, separadores muy suaves */
.actbar{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;padding:3px;border:1px solid var(--line);border-radius:var(--r-box);background:var(--bg)}
.actbar>*{position:relative}
.actbar>*+*::before{content:"";position:absolute;left:-3px;top:24%;bottom:24%;width:1px;background:var(--ink);opacity:.12}
.actbar .btn{border:0;background:transparent;padding:6px var(--s4)}
.actbar .btn:hover{background:var(--hover)}
.boxfoot{padding:var(--s1) var(--s2);border-top:1px solid var(--line)}
.boxfoot .btn{border:0;background:none;color:var(--muted);padding:6px var(--s3)}
.boxfoot .btn:hover{background:var(--hover);color:var(--ink)}

/* Botones y menús */
.bar{display:flex;flex-wrap:wrap;gap:var(--s2)}
.btn{display:inline-flex;align-items:center;gap:var(--s2);border:1px solid var(--line);background:var(--bg);padding:5px var(--pad);border-radius:var(--r);font-size:var(--fs-small);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.x{border:0;padding:5px var(--s2);color:var(--muted)}
.dd{position:relative}
.menu,.dd-list{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-box);padding:var(--s1);min-width:200px;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.dd-list{display:none;position:absolute;left:0;top:calc(100% + var(--s1))}
.dd.open .dd-list{display:block}
.side-dd .dd-list{position:fixed;z-index:100;min-width:210px}
.menu{position:fixed}
.menu[hidden]{display:none}
.menu button,.dd-list button,.dd-list a{display:block;width:100%;text-align:left;border:0;background:none;padding:6px var(--pad);border-radius:6px;font-size:var(--fs-small)}
.menu button:hover,.dd-list button:hover,.dd-list a:hover{background:var(--hover)}
.dd-list hr{border:0;border-top:1px solid var(--line);margin:var(--s1) 0}

/* Caja: filas de acciones arriba, luego header/filas */
.box{border:1px solid var(--line);border-radius:var(--r-box);overflow:hidden;margin-top:var(--s2)}
/* Forms: no table-like containers. Each field is a separate, quiet control. */
.form{display:flex;flex-direction:column;gap:10px;margin-top:var(--s3);max-width:720px}
.form-field{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.form-field:focus-within{border-color:var(--accent)}
.form-field label{display:block;font-size:var(--fs-cap);color:var(--muted);margin-bottom:3px}
.form-field label:empty{display:none}
.form-field input,.form-field select,.form-field textarea{width:100%;border:0;background:transparent;padding:2px 0;outline:0;color:var(--ink)}
.form-field .select-wrap{position:relative}
.form-field .select-wrap::after{content:"";position:absolute;right:2px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-65%) rotate(45deg);pointer-events:none}
.form-field select{appearance:none;-webkit-appearance:none;padding-right:24px;cursor:pointer}
.form-field textarea{resize:none;display:block}
.record-actions{margin-bottom:var(--s3)}
.form-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 2px}
.after-table-action{margin:var(--s4) 0 var(--s5);display:flex;justify-content:flex-end}.danger-action{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);max-width:720px}
.danger-action .danger-title{display:block;color:var(--danger);font-size:14px;font-weight:500;border:0;background:none;padding:0;cursor:pointer}
.danger-action .danger-note{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--danger-bg);font-size:13px;color:var(--ink)}
.danger-action .danger-note .bar{margin-top:10px}
.settings-tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:4px 0 0}
.settings-tabs a{position:relative;padding:11px 2px 12px;color:var(--muted);font-size:var(--fs-small);font-weight:500;white-space:nowrap}
.settings-tabs a:hover{color:var(--ink)}
.settings-tabs a.on{color:var(--ink);font-weight:600}
.settings-tabs a.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.settings-shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:460px;border-top:0;margin-top:calc(-1*var(--s6))}
.settings-side{border-right:1px solid var(--line);padding:calc(22px + var(--s6)) 28px 40px 0}
.settings-side a{display:block;padding:10px 10px;border-radius:6px;color:var(--muted);font-size:var(--fs-small)}
.settings-side a:hover{background:var(--hover);color:var(--ink)}
.settings-side a.on{background:var(--hover);color:var(--ink);font-weight:600}
.settings-content{padding:calc(22px + var(--s6)) 0 40px 36px;min-width:0}
.settings-content h2{margin:0 0 5px}
.settings-content>.lead{margin-bottom:20px}
.settings-list{max-width:960px}
.settings-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:48px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line-soft)}
.settings-row:first-child{padding-top:8px}
.settings-row:last-child{border-bottom:0}
.settings-row h3{font-size:15px;font-weight:600;margin:0 0 3px}
.settings-row p{margin:0;color:var(--muted);font-size:var(--fs-cap)}
.settings-row .form-field{margin:0;min-width:0}
.settings-row .form-field select{min-height:28px}
.settings-action{display:flex;justify-content:flex-end;align-items:center;gap:8px}

.cfmini{display:block!important;color:var(--muted)!important;font-size:var(--fs-cap)!important;margin:0 0 4px!important;font-weight:400!important}
.cf-note{margin-top:8px;color:var(--muted);font-size:var(--fs-cap)}
.cf-add{margin-top:18px;padding-top:4px}
.custom-fields-title{margin:24px 0 0;font-size:15px;font-weight:600}
@media(max-width:700px){.cf{grid-template-columns:1fr;gap:10px}}
.settings-status{color:var(--muted);font-size:var(--fs-cap);margin-top:12px;min-height:20px}
.settings-content .cf{max-width:960px;margin-top:10px}
.settings-content .cf:first-child{margin-top:0}
.settings-subsection{margin-top:30px;padding-top:6px}
.settings-subsection h3{font-size:15px;margin:0 0 4px}
.settings-subsection>p{margin:0 0 8px;color:var(--muted);font-size:var(--fs-cap)}

.box.vis{overflow:visible}
.box+.box{margin-top:var(--s4)}
.box table{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
.box th{font-weight:500;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.box td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.box tr:last-child td{border-bottom:0}
.box tr.go{cursor:pointer}
.box tr.go:hover td{background:var(--hover)}
.box tr.go td:first-child{font-weight:500}
.box tr.go:focus-within td{background:var(--hover)}
.box .k{width:210px;color:var(--muted)}
.box .v{white-space:pre-wrap}
.box .num{text-align:right;font-variant-numeric:tabular-nums}
.box .tot td{font-weight:600;background:var(--side)}
.head,.boxbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;padding:var(--s2);border-bottom:1px solid var(--line);background:var(--side)}
.table-tools{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin:0 0 var(--s3)}
.table-tools .grow{flex:1;min-width:180px}
.table-tools input,.table-tools select{padding:7px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-height:34px}
.table-tools .btn{min-height:34px}
.course-actions-row,.record-actions,.student-payment-actions,.filetools{display:flex;justify-content:center}
.course-actions-row{margin:24px 0 24px}
.record-actions{margin:24px 0}
.student-payment-actions{margin:20px 0 16px}
.filetools{margin:24px 0 16px}
.filetools .actbar{justify-content:center}
.head{justify-content:flex-start;border-radius:var(--r-box) var(--r-box) 0 0}.head .primary{margin-right:auto}.head .danger{margin-left:auto}
.head .dd-list{left:auto;right:0}
.boxbar input,.boxbar select{padding:5px var(--pad);border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.boxbar .grow{flex:1;min-width:140px}
.box .callout{margin:0;border-radius:0;padding:var(--s3) var(--pad);background:var(--hover);font-size:var(--fs-small)}
.box .callout.danger{background:var(--danger-bg)}
.tag{display:inline-block;padding:1px var(--s2);border-radius:4px;font-size:var(--fs-cap);background:var(--hover)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.danger{background:var(--danger-bg);color:var(--danger)} .tag.info{background:var(--hover);color:var(--ink)}
.tag.link:hover{background:var(--line)}

/* Formularios: filas etiqueta | campo (la etiqueta siempre arriba) */
.cf{display:grid;grid-template-columns:minmax(180px,1fr) minmax(260px,1.6fr);gap:var(--s4);margin-top:18px;padding-top:2px}
.cf .form-field{margin:0;min-width:0}
.cfval{position:relative;display:block;width:100%;min-width:0;min-height:64px;padding:10px 9px;border-radius:6px;outline:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.cfval:hover{background:var(--hover)}
.cfval:focus{background:var(--bg);border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.cfval.is-empty:before{content:attr(data-placeholder);position:absolute;left:9px;top:10px;color:var(--muted);pointer-events:none}
.cfval .mention,.mention{color:var(--accent);background:var(--mention-bg);border-radius:4px;padding:0 3px;font-weight:500;text-decoration:none;white-space:nowrap;cursor:pointer}
.cfval .mention:hover,.mention:hover{background:var(--mention-bg-hover)}
.addfield td{padding:6px 8px}
.addfield .btn{border:0;background:none;color:var(--muted);padding:2px 4px}
.addfield .btn:hover{background:var(--hover);color:var(--ink)}
.trashbtn{color:var(--danger)}
.trashbtn:hover{background:var(--danger-bg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:var(--s4) 0}
.tabs a{padding:var(--s2) var(--pad);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-color:var(--ink);font-weight:500}
.settings-lead{margin-bottom:var(--s2)}

/* Explorador de archivos */
.files{min-height:60vh;margin:0 calc(var(--s2) * -1)}
.fi{display:flex;align-items:center;gap:var(--pad);padding:var(--s2) var(--pad);border-radius:6px;user-select:none;outline-offset:-2px}
.fi:hover,.fi.sel{background:var(--hover)}
.fi:focus-visible{background:var(--hover)}
.fi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-comment-count{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--muted);font-size:12px;padding:3px 6px;border-radius:6px;opacity:.75}.file-comment-count:hover{background:var(--hover);opacity:1;color:var(--ink)}.file-comment-count svg{width:14px;height:14px}
.ren{flex:1;min-width:0;border:1px solid var(--accent);border-radius:4px;padding:0 6px;background:var(--bg);outline:0}

/* Editor */
.edbar{position:static;display:flex;max-width:720px;margin:var(--s4) auto 0;flex-wrap:wrap;gap:var(--s2);justify-content:space-between;align-items:center;padding:0 0 var(--s3);background:var(--bg)}
.tools{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:3px}
.grp{display:inline-flex;align-items:center;gap:1px;padding:0 var(--s1)}
.grp+.grp{border-left:1px solid var(--line)}
.tools button,.tools select{border:0;background:none;border-radius:6px;min-width:30px;height:30px;padding:0 7px}
.tools button:hover,.tools select:hover{background:var(--hover)}
.doc{max-width:720px;margin:var(--s5) auto 0;outline:0;font-size:16px;line-height:1.75}
.doc h1{font-size:34px;margin:0 0 var(--s5)}
.doc h2{font-size:21px;margin:var(--s5) 0 var(--s2)}
.doc p,.doc ul{margin:0 0 var(--s4)}
.doc code{background:var(--hover);padding:1px 6px;border-radius:4px}
.doc table{border-collapse:separate;border-spacing:0;width:100%;margin:0 0 var(--s5);font-size:var(--fs-small);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.doc th,.doc td{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px var(--pad);text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
.doc tr:last-child td,.doc tr:last-child th{border-bottom:0}
.doc tr td:last-child,.doc tr th:last-child{border-right:0}
.doc th{background:var(--side);font-weight:500}
.doc a{color:var(--accent)}


/* Cabecera contextual del documento */
.doc-meta{margin-left:auto;display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--muted);font-size:12px}
.doc-meta[hidden]{display:none}
.doc-meta #lastEdited{color:var(--muted)}
.doc-meta .share-doc{margin-left:5px;color:var(--ink);width:30px;height:30px}
.doc-meta .share-doc svg{width:16px;height:16px;opacity:.72}
.document-open .top #crumbs{max-width:42%}

/* Editor: acciones discretas y barra contextual */
.edbar{max-width:720px;margin:var(--s3) auto 0;display:flex;align-items:center;justify-content:flex-end;gap:10px;min-height:32px}
.edbar .save-state{margin-right:auto;color:var(--muted);font-size:12px}
.edbar-actions{display:flex;align-items:center;gap:5px}
.edbar-actions .iconbtn{width:30px;height:30px;border:1px solid transparent}
.edbar-actions .iconbtn:hover{border-color:var(--line);background:var(--side)}
.edbar-actions .iconbtn svg{width:16px;height:16px}
.selection-toolbar{position:fixed;z-index:75;display:flex;align-items:center;gap:2px;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(25,35,45,.14);max-width:calc(100vw - 20px);white-space:nowrap}
.selection-toolbar[hidden]{display:none}
.selection-toolbar button,.selection-toolbar select{height:30px;min-width:30px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.selection-toolbar button:hover,.selection-toolbar select:hover{background:var(--hover)}
.selection-toolbar button svg{width:16px;height:16px;opacity:.78}
.selection-toolbar .toolbar-divider{height:21px;width:1px;background:var(--line);margin:0 3px}
.selection-toolbar .block-select{max-width:130px;min-width:112px;justify-content:flex-start}
.selection-toolbar .block-select select{width:100%;text-align:left;padding-left:7px}
.selection-toolbar .tool-color{position:relative;overflow:hidden}
.selection-toolbar .tool-color{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;cursor:pointer}.selection-toolbar .tool-color:hover{background:var(--hover)}.selection-toolbar input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:auto;cursor:pointer}
.selection-toolbar .tool-more{position:relative}
.selection-toolbar .more-menu{position:absolute;top:38px;right:0;min-width:150px;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(25,35,45,.14);display:grid;gap:2px}
.selection-toolbar .more-menu[hidden]{display:none}
.selection-toolbar .more-menu button{justify-content:flex-start;width:100%;height:32px}
.doc h3,.doc h4{font-weight:600;line-height:1.35;margin:var(--s4) 0 var(--s2)}
.doc h3{font-size:18px}.doc h4{font-size:16px}
.doc blockquote{margin:var(--s3) 0;padding:3px 0 3px 14px;border-left:3px solid var(--line);color:var(--muted)}
.doc ul.task-list{list-style:none;padding-left:0}
.doc .doc-mention,.doc a.doc-mention{color:#2674b9;background:#edf5fc;border-radius:4px;padding:1px 4px;font-weight:500;text-decoration:none;cursor:pointer;white-space:nowrap}
.doc .doc-mention:hover{background:#dcecf9}.doc .doc-mention:focus-visible{outline:2px solid #8bb9df;outline-offset:2px}

/* Side Chat: panel de conversación de la maqueta */
.sidechat{position:relative;z-index:2;width:100%;min-width:0;display:flex;flex-direction:column;background:var(--bg);border:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none;opacity:0;transform:translateX(8px);pointer-events:none;transition:opacity .2s ease,transform .24s cubic-bezier(.22,1,.36,1)}
.sidechat.open{opacity:1;transform:translateX(0);pointer-events:auto}
.sidechat[hidden]{display:none}
.sidechat-head{height:54px;flex:none;display:flex;align-items:center;gap:8px;padding:0 13px;border-bottom:1px solid var(--line)}
.sidechat-tab{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;background:var(--side);font-size:13px;font-weight:500}
.sidechat-head .spacer{flex:1}
.sidechat-head button{width:29px;height:29px;border:0;background:transparent;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.sidechat-head button:hover{background:var(--hover);color:var(--ink)}
.sidechat-head button svg{width:15px;height:15px}
.sidechat-body{flex:1;min-height:0;overflow:auto;padding:18px 18px 12px}
.sidechat-intro{max-width:340px;margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.6}.sidechat-intro strong{display:block;color:var(--ink);font-weight:500;margin-bottom:5px}
.chat-messages{display:flex;flex-direction:column;gap:14px}
.chat-message{max-width:92%;align-self:flex-start;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.chat-message.mine{align-self:flex-end;background:var(--side);border:1px solid var(--line);border-radius:12px 12px 3px 12px;padding:9px 11px}
.comment-options{position:relative;float:right;margin:-4px -4px 2px 8px;color:var(--muted)}.comment-options summary{list-style:none;cursor:pointer;padding:0 5px;border-radius:5px}.comment-options summary::-webkit-details-marker{display:none}.comment-options[open] div{position:absolute;right:0;top:22px;z-index:4;min-width:110px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 5px 18px rgba(0,0,0,.1)}.comment-options button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:5px;font-size:12px}.comment-options button:hover{background:var(--hover)}.chat-message .chat-quote{display:block;border-left:2px solid var(--accent);padding:3px 0 3px 9px;margin:0 0 7px;color:var(--muted);font-size:12px}
.chat-message .mention{color:#2674b9;background:#edf5fc;border-radius:4px;padding:1px 4px;font-weight:500;text-decoration:none;cursor:pointer}
.sidechat-compose{flex:none;padding:10px 12px 12px}
.chat-compose-box{border:1px solid #dfe2e5;border-radius:12px;padding:10px 12px 8px;background:var(--bg);transition:border-color .15s ease,box-shadow .15s ease}
.chat-compose-box:focus-within{border-color:#b9cddd;box-shadow:0 0 0 3px rgba(70,130,180,.08)}
.chat-input{min-height:28px;max-height:130px;overflow:auto;outline:0;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.chat-input:empty:before{content:attr(data-placeholder);color:#9a9fa4;pointer-events:none}
.chat-input .chat-context{display:inline;color:var(--muted);font-size:12px}.chat-input .chat-context em{font-style:italic}.chat-input .mention{color:#2674b9;background:#edf5fc;border-radius:4px;padding:1px 4px;font-weight:500;cursor:pointer}
.chat-compose-foot{display:flex;justify-content:flex-end;align-items:center;margin-top:5px;color:var(--muted);font-size:12px}
.chat-compose-foot button{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:3px 6px}
.chat-compose-foot button:hover{background:var(--hover);color:var(--ink)}
.chat-compose-foot button svg{width:14px;height:14px;vertical-align:middle}
@media(max-width:820px){
  .doc-meta{gap:3px;font-size:12px}
  .doc-meta>span:first-child{display:none}
  .selection-toolbar{gap:0;padding:4px;overflow-x:auto;scrollbar-width:none}
  .selection-toolbar::-webkit-scrollbar{display:none}
  .selection-toolbar button{min-width:28px;padding:0 6px}
}

/* Menú contextual de tablas del editor */
.tblbar{position:fixed;z-index:35;display:flex;align-items:center;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.1)}
.tblbar[hidden]{display:none}
.tblbar button{border:0;background:none;border-radius:6px;padding:4px 8px;font-size:var(--fs-cap);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.tblbar button:hover{background:var(--hover)}
.tblbar svg{width:14px;height:14px}

/* Periodos guardados / solo lectura */
.yearbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:var(--s3);padding:7px var(--s6);background:var(--ink);color:var(--bg);font-size:var(--fs-small)}
.yearbar .ybic{display:grid;place-items:center}
.yearbar .ybic svg{opacity:.9}
.yearbar .spacer{flex:1}
.yearbar .tag{background:rgba(255,255,255,.14);color:inherit}
.yearbar .btn{background:transparent;border-color:rgba(255,255,255,.28);color:inherit}
.yearbar .btn:hover{background:rgba(255,255,255,.1)}
.yearbar[hidden]{display:none}
body.archived main{background:#f4f4f4}body.archived .top{top:41px}
body.archived .edbar,body.archived .danger,body.archived .head .btn,body.archived .boxbar .btn,
body.archived .filetools,body.archived .boxfoot,body.archived .nav .mut,body.archived .nav .group .dd,body.archived .addfield{display:none!important}
body.archived .box td.in input,body.archived .box td.in select,body.archived .box td.in textarea,body.archived .cfval{pointer-events:none}
body.archived .doc{pointer-events:none}

/* Paneles (Nube y años) */
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.pagehead h1{margin-bottom:var(--s1)}
.pagehead .primary{margin-left:auto}
.panel{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:var(--s4);background:var(--bg)}
.panel-main{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);flex-wrap:wrap}
.panel-main .grow{flex:1;min-width:160px}
.panel-main strong{display:block;font-size:15px;font-weight:600}
.panel-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:9px var(--s4);border-top:1px solid var(--line);background:var(--side);font-size:var(--fs-cap);color:var(--muted);flex-wrap:wrap}
.panelic{width:38px;height:38px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--side);display:grid;place-items:center}
.panelic svg{width:19px;height:19px;opacity:.7}
.cloudacts{display:flex;gap:var(--s2);flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;color:var(--ink);font-size:var(--fs-small)}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;flex:none;margin:0;border:1px solid var(--line);border-radius:999px;background:var(--hover);position:relative;cursor:pointer;transition:background .12s ease,border-color .12s ease}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .12s ease}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}
.switch input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{display:flex;align-items:center;gap:var(--s2);color:var(--muted);font-size:var(--fs-cap);margin:var(--s3) 0 0}
.notice svg{width:14px;height:14px}
.bdate{font-weight:500}
.bmeta{display:block;color:var(--muted);font-size:var(--fs-cap);margin-top:1px}
.rowacts{display:flex;justify-content:flex-end;gap:2px}
.yearbig{font-size:18px;font-weight:600;letter-spacing:-.01em}
.yearlist tr td{vertical-align:middle}

/* Menú @ y avisos */
.atmenu{position:fixed;z-index:80;width:300px;max-height:300px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 12px 38px rgba(0,0,0,.16)}
.atmenu[hidden]{display:none}
.atitem{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:7px 9px;border-radius:6px;font-size:var(--fs-small);color:var(--ink)}
.atitem:hover,.atitem.on{background:var(--hover)}
.atitem svg{opacity:.5}
.atitem .an{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atempty{padding:8px 10px;color:var(--muted);font-size:var(--fs-cap)}
.atupload{border-top:1px solid var(--line);margin-top:4px;padding-top:7px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:var(--fs-small);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}

/* Diálogos */
.modal{position:fixed;inset:0;z-index:90;background:rgba(20,22,24,.45);display:grid;place-items:center;padding:var(--s4)}
.modal[hidden]{display:none}
.modal-card{width:min(460px,100%);background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.28);overflow:hidden}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:14px 16px 0}

.mlabel{display:block;font-size:var(--fs-cap);color:var(--muted);margin:var(--s2) 0 5px}

.mnote{background:var(--side);border:1px solid var(--line);border-radius:8px;padding:var(--s3);color:var(--muted);font-size:var(--fs-cap);margin-top:var(--s3)}
.mfoot{display:flex;justify-content:flex-end;gap:var(--s2);padding:16px}

function nodeText(node){
  if(node.nodeType===3)return node.nodeValue;
  if(node.nodeType!==1)return "";
  if(node.classList.contains("mention"))return `@{${node.dataset.doc}}`;
  if(node.tagName==="BR")return "\n";
  let s=[...node.childNodes].map(nodeText).join("");
  if(node.tagName==="DIV"||node.tagName==="P")s="\n"+s;
  return s;
}

function rememberEditorSelection(){
  const sel=getSelection(),ed=$("#ed"),bar=$("#selectionToolbar");
  if(!sel||!sel.rangeCount||!ed||bar?.contains(document.activeElement)||sel.isCollapsed)return;
  const r=sel.getRangeAt(0);
  if(ed.contains(r.commonAncestorContainer))savedEditorRange=r.cloneRange();
}
function restoreEditorSelection(){
  const ed=$("#ed");
  if(!ed||!savedEditorRange||!ed.contains(savedEditorRange.commonAncestorContainer))return false;
  const sel=getSelection();sel.removeAllRanges();sel.addRange(savedEditorRange);ed.focus();return true;
}
function runEditorCommand(command,value=null){

function applyBlock(type){
  if(!type)return;restoreEditorSelection();
  const map={h1:"h1",h2:"h2",h3:"h3",h4:"h4",quote:"blockquote"};
  if(map[type])document.execCommand("formatBlock",false,map[type]);
  else if(type==="ul")document.execCommand("insertUnorderedList");
  else if(type==="ol")document.execCommand("insertOrderedList");
  else if(type==="task")document.execCommand("insertHTML",false,'<ul class="task-list"><li>☐ </li></ul>');
  else if(type==="toggle")document.execCommand("insertHTML",false,'<details open><summary>Contenido desplegable</summary><p>Escribe aquí…</p></details>');
  else if(type==="p")document.execCommand("formatBlock",false,"p");
  notifyEdit();rememberEditorSelection();
}

function relativeTime(timestamp){
  const seconds=Math.max(0,Math.floor((Date.now()-timestamp)/1000));
  if(seconds<45)return "Ahora mismo";
  if(seconds<3600){const m=Math.floor(seconds/60);return `Hace ${m} ${m===1?"minuto":"minutos"}`;}
  if(seconds<86400){const h=Math.floor(seconds/3600);return `Hace ${h} ${h===1?"hora":"horas"}`;}
  const days=Math.floor(seconds/86400);
  if(days<7)return `Hace ${days} ${days===1?"día":"días"}`;
  const weeks=Math.floor(days/7);
  if(weeks<5)return `Hace ${weeks} ${weeks===1?"semana":"semanas"}`;
  const months=Math.floor(days/30);
  if(months<12)return `Hace ${months} ${months===1?"mes":"meses"}`;
  const years=Math.floor(days/365);
  return `Hace ${years} ${years===1?"año":"años"}`;
}

function updateSelectionToolbar(){

function serializeChatInput(el){
  const clone=el.cloneNode(true);
  clone.querySelectorAll(".chat-context").forEach(node=>{const q=document.createElement("span");q.className="chat-quote";q.innerHTML=node.innerHTML;node.replaceWith(q);});
  clone.querySelectorAll(".mention[data-doc]").forEach(node=>{
    const id=node.dataset.doc, f=find(id),a=document.createElement("a");
    a.className="mention";a.href="#/archivo/"+id;a.textContent="@"+(f?f.name:"Documento");
    node.replaceWith(a);
  });
  clone.querySelectorAll("*").forEach(node=>{
    [...node.attributes].forEach(attr=>{
      if(!(node.tagName==="A"&&["href","class"].includes(attr.name))&&!["class"].includes(attr.name))node.removeAttribute(attr.name);
    });
  });
  return clone.innerHTML;
}

/* Copias de seguridad (maqueta local) */
let backups=[];
function backupSnapshot(){return {app:"Office Pro",kind:"copia-completa",createdAt:new Date().toISOString(),institution:deep(inst),current:{courses:deep(courses),students:deep(students),files:deep(root.children)},years:deep(archivedYears)};}
function sizeLabel(o){const b=240*1024+new Blob([JSON.stringify(o)]).size;return b>=1048576?`${(b/1048576).toFixed(1)} MB`:`${Math.round(b/1024)} KB`;}
function nowParts(){const d=new Date();return {date:d.toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"numeric"}),time:d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})};}
function createBackup(){
  if(activeYear){toast("Vuelve al periodo actual para crear una copia");return;}
  const p=backupSnapshot(),q=nowParts();
  backups.unshift({id:"b"+(++n),date:q.date,time:q.time,type:"Manual",payload:p,size:sizeLabel(p)});
  render();toast("Copia creada");
}
function downloadBackup(id){
  const b=backups.find(x=>x.id===id);if(!b)return;
  const blob=new Blob([JSON.stringify(b.payload,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`office-pro-copia-${(b.date||"").replace(/\s/g,"-")}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast("Descarga iniciada");
}
function restoreBackup(id){
  const b=backups.find(x=>x.id===id);if(!b)return;
  showModal({title:"Restaurar copia",
    body:`<p>Se reemplazarán todos los datos actuales por la copia del <strong>${esc(b.date)} · ${esc(b.time)}</strong>.</p><div class="mnote">Incluye archivos, cursos, estudiantes y todos los periodos archivados.</div>`,
    actions:[{label:"Cancelar",fn:closeModal},{label:"Restaurar",cls:"danger",fn:()=>{
      const p=b.payload;
      if(p.current){courses.splice(0,courses.length,...deep(p.current.courses));students.splice(0,students.length,...deep(p.current.students));root.children=deep(p.current.files);}
      inst=deep(p.institution||inst);archivedYears=deep(p.years||archivedYears);
      activeYear=null;live=null;document.body.classList.remove("archived");
      closeModal();render();toast("Copia restaurada");
    }}]});
}

/* Menciones @ en valores */
let atCtx=null,atItems=[],atIndex=0,atUploadCtx=null;
function closeAt(){const m=$("#at");if(m)m.hidden=true;atCtx=null;atItems=[];}
function detectAt(el){
  if(activeYear)return closeAt();
  const sel=getSelection();
  if(!sel.rangeCount||!sel.isCollapsed)return closeAt();
  const node=sel.anchorNode;
  if(!node||node.nodeType!==3||!el.contains(node))return closeAt();
  const pos=sel.anchorOffset,text=node.nodeValue.slice(0,pos).replace(/\u00A0/g," "),m=text.match(/@([^@\n]{0,40})$/);
  if(!m)return closeAt();
  if(el.classList.contains("cfval")&&el.querySelector(".mention")){
    if(m[1]==="")toast("Solo puedes adjuntar un documento por valor");
    return closeAt();
  }
  atCtx={el,node,start:pos-m[0].length,end:pos,query:m[1]};
  renderAt();
}
function renderAt(){
  const m=$("#at");if(!atCtx)return;
  const q=atCtx.query.toLowerCase();
  atItems=allDocs().filter(f=>f.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  if(atIndex>=atItems.length)atIndex=0;
  m.innerHTML=atItems.length?atItems.map((f,i)=>`<button type="button" class="atitem${i===atIndex?" on":""}" role="option" aria-selected="${i===atIndex?"true":"false"}" onmousedown="event.preventDefault()" onclick="pickMentionAt(${i})">${I.doc}<span class="an">${esc(f.name)}</span></button>`).join(""):`<div class="atempty">No hay documentos</div>`;
  m.insertAdjacentHTML("beforeend",`<button type="button" class="atitem atupload" role="option" aria-selected="false" onmousedown="event.preventDefault()" onclick="uploadMention()">${I.upload}<span class="an">Subir documento…</span></button>`);
  m.hidden=false;
  const r=document.createRange();r.setStart(atCtx.node,Math.min(atCtx.start,atCtx.node.nodeValue.length));r.collapse(true);
  const b=r.getBoundingClientRect(),w=300;
  let x=b.left,y=b.bottom+6;
  if(x+w>innerWidth-12)x=Math.max(12,innerWidth-w-12);
  if(y+m.offsetHeight>innerHeight-12)y=Math.max(12,b.top-m.offsetHeight-6);
  m.style.left=x+"px";m.style.top=y+"px";
}
function pickMentionAt(i){const f=atItems[i];if(f)insertMention(f.id);}
function insertMention(id){
  const c=atCtx,f=find(id);if(!c||!f)return;
  const el=c.el;closeAt();
  if(el.classList.contains("cfval")&&el.querySelector(".mention")){toast("Solo puedes adjuntar un documento por valor");return;}
  const node=c.node,max=Math.min(c.end,node.nodeValue.length);
  const range=document.createRange();range.setStart(node,Math.min(c.start,max));range.setEnd(node,max);range.deleteContents();
  const span=document.createElement("span");span.className=el.id==="ed"?"doc-mention mention":"mention";span.contentEditable="false";span.dataset.doc=id;span.setAttribute("role","link");span.setAttribute("tabindex","0");span.textContent="@"+f.name;
  const space=document.createTextNode("\u00A0");
  const frag=document.createDocumentFragment();frag.appendChild(span);frag.appendChild(space);
  range.insertNode(frag);
  const after=document.createRange();after.setStartAfter(space);after.collapse(true);
  const sel=getSelection();sel.removeAllRanges();sel.addRange(after);
  el.focus();if(el.classList.contains("cfval"))updateEmpty(el);if(el.id==="ed")notifyEdit();
}

async function exportEditorPDF(){
  const ed=$("#ed");if(!ed){toast("Abre un documento para exportarlo");return;}
  const title=(find(ed.dataset.id)?.name||"Documento").replace(/[\\/:*?"<>|]/g,"-");
  const raw=(ed.innerText||"").replace(/\r/g,"");
  const lines=[];
  raw.split("\n").forEach(line=>{
    const clean=line.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g," ");
    if(!clean.trim()){lines.push("");return;}
    for(let i=0;i<clean.length;i+=88)lines.push(clean.slice(i,i+88));
  });
  const pages=[];for(let i=0;i<Math.max(1,lines.length);i+=48)pages.push(lines.slice(i,i+48));
  const objects=[];const add=o=>{objects.push(o);return objects.length;};
  const catalogId=add("");const pagesId=add("");const fontId=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
  const pageIds=[];
  for(const pageLines of pages){
    let stream="BT\n/F1 10 Tf\n50 790 Td\n14 TL\n";
    for(const line of pageLines){const safe=line.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");stream+=`(${safe}) Tj\nT*\n`;}
    stream+="ET";
    const streamId=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    const pageId=add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ${fontId} 0 R >> >> /Contents ${streamId} 0 R >>`);pageIds.push(pageId);
  }
  objects[catalogId-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
  objects[pagesId-1]=`<< /Type /Pages /Kids [${pageIds.map(id=>`${id} 0 R`).join(" ")}] /Count ${pageIds.length} >>`;
  let pdf="%PDF-1.4\n";const offsets=[0];
  objects.forEach((obj,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
  const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objects.length+1} /Root ${catalogId} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const blob=new Blob([pdf],{type:"application/pdf"});
  try{
    if(window.showSaveFilePicker){const handle=await window.showSaveFilePicker({suggestedName:`${title}.pdf`,types:[{description:"Documento PDF",accept:{"application/pdf":[".pdf"]}}]});const writable=await handle.createWritable();await writable.write(blob);await writable.close();toast("PDF guardado");}
    else{const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`${title}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast("Descarga de PDF iniciada");}
  }catch(error){if(error?.name!=="AbortError")toast("No se pudo guardar el PDF");}
}

    if(a==="administracion"&&b==="ficha"){crumb({t:"Ajustes",h:"#/ajustes/administracion/desactivados"},{t:"Mateo Nze Abaga"});return `${kv([["Tipo","Estudiante"],["Estado",'<span class="tag danger">Desactivado</span>'],["Origen","Directo"],["Desactivado el","14 oct 2026 · 09:12"]])}<h2>Relacionados</h2>${table(["Tipo","Fecha","Importe"],`<tr><td>Pago</td><td>12 sep 2026</td><td>${fmt(5000)}</td></tr><tr><td>Pago</td><td>10 oct 2026</td><td>${fmt(5000)}</td></tr>`)}<h2>Historial</h2>${table(["Fecha","Acción"],`<tr><td>14 oct 2026 · 09:12</td><td>Desactivado</td></tr><tr><td>1 sep 2026 · 10:00</td><td>Creado</td></tr>`)}`;}
    return head+shell("Historial",`<div class="table-tools"><input class="grow" placeholder="Buscar"><select><option>Todas las acciones</option><option>Creado</option><option>Modificado</option><option>Desactivado</option></select><input type="date"><input type="date"></div><div class="box"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>${row("#/ajustes/administracion/ficha",["23 oct 2026","Pago",'<span class="tag ok">Creado</span>',"Ana Martínez Obiang · "+fmt(5000)])}${row("#/ajustes/administracion/ficha",["22 oct 2026","Estudiante",'<span class="tag info">Modificado</span>',"Nombre cambiado"])}${row("#/ajustes/administracion/ficha",["14 oct 2026","Estudiante",'<span class="tag danger">Desactivado</span>',"Mateo Nze Abaga"])}</tbody></table></div>`);
  },
  nube(){
    if(location.hash==="#/nube"){location.replace("#/ajustes/sistema/copias");return "";}
    crumb({t:"Copias de seguridad"});
    const latest=backups[0];
    const rows=backups.length?backups.map(b=>`<tr><td><span class="bdate">${esc(b.date)}</span><span class="bmeta">${esc(b.time)} · ${esc(b.type)}</span></td><td class="num"><div class="rowacts"><button type="button" class="btn x" title="Descargar copia" onclick="downloadBackup('${b.id}')">${I.download}</button><button type="button" class="btn x" title="Restaurar copia" onclick="restoreBackup('${b.id}')">${I.restore}</button></div></td></tr>`).join(""):`<tr><td colspan="2" class="empty">Todavía no hay copias de seguridad</td></tr>`;
    return `<p class="lead">Guarda una copia completa de todos los datos y periodos archivados. Para llevarlos a otro equipo, usa <a href="#/ajustes/datos/base-de-datos">Base de datos</a>.</p>
    <div class="panel">
      <div class="panel-main"><span class="panelic">${I.cloud}</span><div class="grow"><strong>${latest?"Última copia":"Sin copias todavía"}</strong><span class="bmeta">${latest?`${esc(latest.date)} · ${esc(latest.time)}`:"Crea la primera cuando quieras"}</span></div>
      <div class="actbar">${btn("Importar copia",{ico:I.upload,on:"pickBackup()"})}${btn("Crear copia",{ico:I.plus,on:"createBackup()"})}</div></div>
      <div class="panel-foot"><label class="switch"><input type="checkbox" checked onchange="toast(this.checked?'Copia automática diaria activada':'Copia automática desactivada')"> Copia automática diaria</label></div>
    </div>
    <h2 style="margin-top:34px">Historial</h2>
    <div class="box"><table><thead><tr><th>Copia</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  },
};

/* Router y eventos */
function post(){
  document.querySelectorAll("textarea").forEach(grow);
  document.querySelectorAll(".cfval").forEach(updateEmpty);
  const r=$(".ren");if(r){r.focus();r.select();}
  const yb=$("#yearbar");
  document.body.classList.toggle("archived",!!activeYear);
  if(activeYear){
    const y=archivedYears.find(x=>x.id===activeYear);
    $("#ybname").textContent="Periodo archivado · "+(y?y.name:inst.year);
    yb.hidden=false;
  }else yb.hidden=true;
  $("#tblbar").hidden=true;
  enhanceA11y();setupDropdownA11y();announceCount();updateDocHeader();
  const ra=$("#routeAnnounce"),rh=$("#page h1")||$("#crumbs");if(ra&&rh)ra.textContent=rh.textContent.trim();
}
function render(){
  if(!location.hash)location.hash="#/inicio";
  const [,v="curso",a,b]=location.hash.split("/");
  const welcome=v==="inicio";
  if(!window.keepCommentsOpen){sideChatOpen=false;const panel=$("#sideChat");if(panel){panel.classList.remove("open");panel.hidden=true;}}
  window.keepCommentsOpen=false;
  document.body.classList.remove("sidechat-visible","file-comments-visible","course-comments-visible");
  if(v!=="archivo"&&v!=="archivos"&&v!=="curso"){sideChatOpen=false;activeCommentFile=null;activeCommentCourse=null;}
  document.body.classList.toggle("welcome-mode",welcome);
  document.body.classList.toggle("document-open",v==="archivo");
  $("#page").innerHTML=(V[v]||V.curso)(a,b);
  $("#selectionToolbar").hidden=true;
  renderNav(location.hash);
  post();
  $("main").scrollTo(0,0);
}
addEventListener("hashchange",render);
document.addEventListener("click",e=>{
  const mention=e.target.closest?.(".mention[data-doc]");
  if(mention&&mention.dataset.doc){e.preventDefault();openF(mention.dataset.doc);return;}
  $("#ctx").hidden=true;
  if(!e.target.closest("#at")&&!e.target.closest(".cfval"))closeAt();
  if(!e.target.closest(".custom-block-select")){$("#blockMenu").hidden=true;document.querySelector(".block-trigger")?.setAttribute("aria-expanded","false");}
  if(!e.target.closest(".color-picker-wrap")){$("#colorMenu").hidden=true;document.querySelector(".color-trigger")?.setAttribute("aria-expanded","false");}
  const dd=e.target.closest("[data-dd]");
  document.querySelectorAll(".dd.open").forEach(x=>{if(!dd||x!==dd.parentElement)x.classList.remove("open");});
  if(dd){
    const wrap=dd.parentElement;const isOpen=wrap.classList.toggle("open");dd.setAttribute("aria-expanded",String(isOpen));
    if(wrap.classList.contains("side-dd")){
      const list=wrap.querySelector(".dd-list"),r=dd.getBoundingClientRect();
      list.style.left=(r.right+8)+"px";
      const h=Math.min(list.offsetHeight,innerHeight-16);
      list.style.top=Math.max(8,Math.min(r.top,list?innerHeight-h-8:innerHeight-8))+"px";
    }
  }
  const tg=e.target.closest("[data-tg]");
  if(tg){open.has(tg.dataset.tg)?open.delete(tg.dataset.tg):open.add(tg.dataset.tg);if(location.hash===tg.getAttribute("href"))render();}
  if(e.target.closest(".nav a"))$("#side").classList.remove("open");
  const fi=e.target.closest(".fi");
  document.querySelectorAll(".fi.sel").forEach(x=>x.classList.remove("sel"));if(fi)fi.classList.add("sel");
});
document.addEventListener("contextmenu",e=>{
  const fs=e.target.closest(".files,.fdir");if(!fs)return;e.preventDefault();
  if(activeYear){toast("Periodo archivado: solo lectura");return;}
  const fi=e.target.closest(".fi,.fdir"),dir=fs.dataset.dir,id=fi&&fi.dataset.id;
  const items=fi?[...(fi.classList.contains("fdir")?[]:[["Abrir",`openF('${id}')`]]),["Renombrar",`ren('${id}')`],["Eliminar",`del('${id}')`]]:[["Nuevo documento",`mk('file','${dir}')`],["Subir archivo",`pick('${dir}')`]];
  const m=$("#ctx");m.setAttribute("role","menu");m.setAttribute("aria-label","Acciones de archivo");m.innerHTML=items.map(([t,f])=>`<button type="button" role="menuitem" onclick="${f}">${t}</button>`).join("");
  m.style.left=Math.min(e.clientX,innerWidth-220)+"px";m.style.top=e.clientY+"px";m.hidden=false;
  m.dataset.openerId=fi?.dataset.id||"";m.dataset.returnFocus=fi?"file":"area";m.querySelector("button")?.focus();
});
document.addEventListener("input",e=>{
  if(e.target.matches?.("#ed,.chat-input"))detectAt(e.target);
  if(e.target.tagName==="TEXTAREA")grow(e.target);
  const form=e.target.closest("form");
  const autosave=e.target.closest(".form[data-autosave]");
  if(autosave)autoSaveRecord(autosave);
});
document.addEventListener("change",e=>{
  const autosave=e.target.closest(".form[data-autosave]");
  if(autosave)autoSaveRecord(autosave);
});
document.addEventListener("change",e=>{
  if(e.target.dataset.f==="tema"){theme=e.target.value;applyTheme();toast(`Tema: ${theme}`);}
});
document.addEventListener("focusout",e=>{if(e.target.matches('[data-f="inst-name"],[data-f="inst-year"],#instCustomFields [data-custom-name],#instCustomFields .cfval'))saveInst();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){$("#ctx").hidden=true;closeAt();$("#tblbar").hidden=true;$("#blockMenu").hidden=true;$("#colorMenu").hidden=true;document.querySelector(".block-trigger")?.setAttribute("aria-expanded","false");document.querySelector(".color-trigger")?.setAttribute("aria-expanded","false");if(!$("#modal").hidden)closeModal();return;}
  if(atCtx&&!$("#at").hidden){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(atItems.length){atIndex=(atIndex+(e.key==="ArrowDown"?1:atItems.length-1))%atItems.length;renderAt();}}
    else if(e.key==="Enter"){e.preventDefault();pickMentionAt(atIndex);}
  }
});
document.addEventListener("keydown",e=>{
  const ctx=$("#ctx");
  if(!ctx.hidden && (e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Escape")){
    const items=[...ctx.querySelectorAll("[role=menuitem]")];const i=items.indexOf(document.activeElement);
    if(e.key==="Escape"){e.preventDefault();ctx.hidden=true;const op=ctx.dataset.openerId&&document.querySelector(`.fi[data-id="${ctx.dataset.openerId}"]`);(op||$(".files"))?.focus?.();return;}
    if(items.length){e.preventDefault();items[(i+(e.key==="ArrowDown"?1:items.length-1))%items.length].focus();}return;
  }
  if(e.key==="Escape"){const openSide=$("#side")?.classList.contains("open");if(openSide){$("#side").classList.remove("open");$("#menuBtn")?.focus();}}
});
$("#menuBtn")?.addEventListener("click",()=>{const side=$("#side"),openSide=side.classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",String(openSide));if(openSide)side.querySelector("a,button")?.focus();});
document.addEventListener("keydown",e=>{
  const b=e.target.closest?.("[data-dd]");if(!b)return;
  const wrap=b.parentElement,list=wrap?.querySelector(".dd-list");if(!list)return;
  if(e.key==="ArrowDown"){e.preventDefault();wrap.classList.add("open");b.setAttribute("aria-expanded","true");list.querySelector("a,button")?.focus();}
  else if(e.key==="Escape"){e.preventDefault();wrap.classList.remove("open");b.setAttribute("aria-expanded","false");b.focus();}
});
document.addEventListener("keydown",e=>{
  const list=e.target.closest?.(".dd-list[role=menu]");if(!list)return;const items=[...list.querySelectorAll("a,button")],i=items.indexOf(document.activeElement);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();items[(i+(e.key==="ArrowDown"?1:items.length-1))%items.length]?.focus();}
  if(e.key==="Escape"){e.preventDefault();const wrap=list.parentElement;wrap.classList.remove("open");wrap.querySelector("[data-dd]")?.focus();wrap.querySelector("[data-dd]")?.setAttribute("aria-expanded","false");}
});
document.addEventListener("selectionchange",()=>{rememberEditorSelection();if(!pointerSelectingText)updateSelectionToolbar();const bar=$("#tblbar");if(!bar.hidden||cellAtCaret())positionTableBar();});
$("main").addEventListener("pointerdown",e=>{if(e.target.closest("#ed")){pointerSelectingText=true;$("#selectionToolbar").hidden=true;}},true);
document.addEventListener("pointerup",()=>{if(!pointerSelectingText)return;setTimeout(()=>{pointerSelectingText=false;updateSelectionToolbar();},0);},true);
document.addEventListener("keyup",e=>{if(e.target.closest?.("#ed"))updateSelectionToolbar();});
addEventListener("scroll",()=>{const bar=$("#tblbar");if(!bar.hidden)positionTableBar();},{passive:true});
$("main").addEventListener("scroll",()=>{const bar=$("#tblbar");if(!bar.hidden)positionTableBar();},{passive:true});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
/* Sidebar: expand from the collapsed rail and resize with the mouse. */
let sideResizing=false,sideStartX=0,sideStartW=264;
const sideEl=$("#side");
function setSideWidth(w){
  const width=Math.max(220,Math.min(420,w));
  document.documentElement.style.setProperty("--side-width",width+"px");$("#sideResizer")?.setAttribute("aria-valuenow",String(Math.round(width)));
}
const sideRz=$("#sideResizer");
sideRz.addEventListener("keydown",e=>{const w=sideEl.getBoundingClientRect().width;if(e.key==="ArrowRight"){e.preventDefault();setSideWidth(w+16);}else if(e.key==="ArrowLeft"){e.preventDefault();setSideWidth(w-16);}else if(e.key==="Home"){e.preventDefault();setSideWidth(264);}});
sideRz.addEventListener("dblclick",()=>setSideWidth(264));
sideEl.addEventListener("pointerdown",e=>{
  if(document.body.classList.contains("rail")){
    if(e.target.closest("a,button")){document.body.classList.remove("rail");return;}
    e.preventDefault();e.stopPropagation();document.body.classList.remove("rail");return;
  }
  if(e.clientX >= sideEl.getBoundingClientRect().right-10){
    sideResizing=true;
    sideStartX=e.clientX;
    sideStartW=sideEl.getBoundingClientRect().width;
    sideEl.setPointerCapture?.(e.pointerId);
    document.body.style.cursor="ew-resize";document.body.classList.add("resizing");
    document.body.style.userSelect="none";
    e.preventDefault();
  }
});
sideEl.addEventListener("pointermove",e=>{
  if(!sideResizing)return;
  setSideWidth(sideStartW+(e.clientX-sideStartX));
});
sideEl.addEventListener("pointerup",e=>{
  if(!sideResizing)return;
  sideResizing=false;
  document.body.style.cursor="";document.body.classList.remove("resizing");
  document.body.style.userSelect="";
  sideEl.releasePointerCapture?.(e.pointerId);
});
sideEl.addEventListener("pointercancel",()=>{
  sideResizing=false;
  document.body.style.cursor="";document.body.classList.remove("resizing");
  document.body.style.userSelect="";
});
addEventListener("keydown",e=>{if(e.ctrlKey&&e.key==="["){e.preventDefault();document.body.classList.toggle("rail");}});
sideEl.addEventListener("focusin",()=>{if(document.body.classList.contains("rail"))document.body.classList.remove("rail");});
$("#back").onclick=()=>history.back();
applyTheme();
seedDemo();
render();
setInterval(updateDocHeader,30000);
</script>
